[tools]
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.151"
prek = "0.5.10"
flatc = "25.12.19-2026-02-06-03fffb2"
"conda:redis-server" = "latest"
rumdl = "latest"
rust = "stable"

# Install the prek Git hooks after `mise install`, so a fresh clone gets them without a separate step.
[hooks]
postinstall = "prek install"

[tasks.lint-docs]
description = "Lint the Markdown documentation with rumdl"
run = "rumdl check docs/ README.md"

[tasks.test]
description = "Run all Rust tests, then the telemetry tests without the otel feature"
run = [
  "cargo nextest run --workspace",
  "cargo test --doc --workspace",
  "cargo nextest run -p discus-membership --features testing",
  "cargo nextest run -p discus-membership --features testing,k8s --test k8s_lease",
  "cargo nextest run -p discus-telemetry",
  "cargo nextest run -p discus --no-default-features --features tls-aws-lc,roots-system --test telemetry --test cluster_trace",
]

[tasks.lint]
description = "Run every prek hook on every file: rustfmt, clippy, rumdl, the wire check, and file hygiene"
run = [
  "prek run --all-files --show-diff-on-failure",
  "prek run --all-files --show-diff-on-failure --stage pre-push",
]

[tasks.hooks]
description = "Install the prek Git hooks (pre-commit and pre-push)"
run = "prek install"

[tasks.gen-wire]
description = "Regenerate the Rust code for the FlatBuffers wire contract"
run = "bash scripts/gen-wire.sh"

[tasks.compat]
description = "Run the redis-cli compatibility matrix against a fresh node"
run = "bash scripts/compat.sh"

[tasks.authelia-e2e]
description = "Run Authelia in a container against a three-node cluster (needs Docker)"
run = "cargo nextest run -p discus --test authelia_e2e --run-ignored only"

[tasks.bench]
description = "Benchmark smoke with redis-benchmark against a release build"
run = "bash scripts/bench.sh"

[tasks.bench-unit]
description = "Run the Criterion benchmarks for the parser and the store"
run = "cargo bench -p discus-resp -p discus-store"

[tasks.bench-compare]
description = "Compare one node with Redis and Valkey under redis-benchmark"
run = "bash scripts/bench-compare.sh"

[tasks.bench-flamegraph]
description = "Record CPU flamegraphs of one node under redis-benchmark"
run = "bash scripts/bench-flamegraph.sh"

[tasks.build-matrix]
description = "Check every build feature combination and the rejected ones"
run = "bash scripts/build-matrix.sh"

[tasks.bench-k8s]
description = "Compare Discus, Redis, and Valkey setups on Kubernetes with memtier_benchmark"
run = "python3 -I scripts/bench-k8s.py"

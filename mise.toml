[tools]
"conda:redis-server" = "latest"
rumdl = "latest"
rust = "stable"

[tasks.lint-docs]
description = "Lint the Markdown documentation with rumdl"
run = "rumdl check docs/ README.md"

[tasks.test]
description = "Run all Rust tests, then the telemetry tests without the otel feature"
run = [
  "cargo test --workspace",
  "cargo test -p discus-telemetry",
  "cargo test -p discus --no-default-features --features tls-aws-lc,roots-system --test telemetry",
]

[tasks.lint]
description = "Run rustfmt, clippy, and the documentation lint"
run = [
  "cargo fmt --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "rumdl check docs/ README.md",
]

[tasks.compat]
description = "Run the redis-cli compatibility matrix against a fresh node"
run = "bash scripts/compat.sh"

[tasks.bench]
description = "Benchmark smoke with redis-benchmark against a release build"
run = "bash scripts/bench.sh"

[tasks.build-matrix]
description = "Check every build feature combination and the rejected ones"
run = "bash scripts/build-matrix.sh"

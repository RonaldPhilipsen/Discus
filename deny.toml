# The policy for `mise run deny`. CI runs that task in the `deny` job.

[advisories]
ignore = []

[licenses]
# Every license here is permissive. A crate that offers a choice, such as `MIT OR LGPL-2.1-or-later`,
# passes through its permissive option, so no copyleft license needs an entry.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

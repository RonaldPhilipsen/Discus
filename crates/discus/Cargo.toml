[package]
name = "discus"
version = "0.0.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
discus-placement = { path = "../discus-placement" }
discus-resp = { path = "../discus-resp" }
discus-store = { path = "../discus-store" }
discus-transport = { path = "../discus-transport", default-features = false }
fastrand = "2"
parking_lot = "0.12"
subtle = "2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
axum = "0.8"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
discus-placement = { path = "../discus-placement", features = ["mock-clock"] }
redis = { version = "0.27", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false }

# Build features, spec §15.5. Most subsystems arrive in later plans, so those features are markers
# for now. The TLS backend selects the QUIC cryptography provider in discus-transport. Exactly one
# TLS backend and one trust root feature must be on.
[features]
default = ["otel", "oauth2", "k8s", "tls-aws-lc", "roots-system"]
otel = []
oauth2 = []
oauth2-introspection = ["oauth2"]
k8s = []
tls-aws-lc = ["discus-transport/tls-aws-lc"]
tls-ring = ["discus-transport/tls-ring"]
tls-openssl = ["discus-transport/tls-openssl"]
roots-system = []
roots-webpki = []

[package]
name = "discus"
version = "0.0.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
discus-resp = { path = "../discus-resp" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

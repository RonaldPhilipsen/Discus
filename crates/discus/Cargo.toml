[package]
name = "discus"
version = "0.0.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
discus-resp = { path = "../discus-resp" }
discus-store = { path = "../discus-store" }
discus-telemetry = { path = "../discus-telemetry" }
fastrand = "2"
subtle = "2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
axum = "0.8"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-openssl = { version = "0.4", default-features = false, features = ["tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1", optional = true }
ipnet = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
x509-parser = "0.18"
ppp = "2"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "json"], optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
redis = { version = "0.27", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tempfile = "3"
base64 = "0.22"
serde_json = "1"
discus-telemetry = { path = "../discus-telemetry", features = ["testing"] }

# Build features, spec §15.5. Exactly one TLS backend and one trust root feature must be on.
# `otel` turns on the telemetry crate's OpenTelemetry code. The TLS and root features also select
# the provider and the roots for TLS to the OTLP collector.
[features]
default = ["otel", "oauth2", "k8s", "tls-aws-lc", "roots-system"]
otel = ["discus-telemetry/otel"]
oauth2 = ["dep:jsonwebtoken", "dep:reqwest", "dep:serde_json"]
oauth2-introspection = ["oauth2"]
k8s = []
tls-aws-lc = ["rustls/aws_lc_rs", "jsonwebtoken?/aws_lc_rs", "discus-telemetry/tls-aws-lc"]
tls-ring = ["rustls/ring", "jsonwebtoken?/rust_crypto", "discus-telemetry/tls-ring"]
tls-openssl = ["dep:rustls-openssl", "jsonwebtoken?/rust_crypto", "discus-telemetry/tls-openssl"]
roots-system = ["dep:rustls-native-certs", "discus-telemetry/roots-system"]
roots-webpki = ["dep:webpki-roots", "discus-telemetry/roots-webpki"]

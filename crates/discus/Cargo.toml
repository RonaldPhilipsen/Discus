[package]
name = "discus"
version = "0.0.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
discus-resp = { path = "../discus-resp" }
discus-store = { path = "../discus-store" }
discus-telemetry = { path = "../discus-telemetry" }
fastrand = "2"
subtle = "2"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
axum = "0.8"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[dev-dependencies]
redis = { version = "0.27", features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false }
discus-telemetry = { path = "../discus-telemetry", features = ["testing"] }

# Build features, spec §15.5. Exactly one TLS backend and one trust root feature must be on.
# `otel` turns on the telemetry crate's OpenTelemetry code. The TLS and root features also select
# the provider and the roots for TLS to the OTLP collector. The other subsystems arrive in later
# plans, so their features are still markers.
[features]
default = ["otel", "oauth2", "k8s", "tls-aws-lc", "roots-system"]
otel = ["discus-telemetry/otel"]
oauth2 = []
oauth2-introspection = ["oauth2"]
k8s = []
tls-aws-lc = ["discus-telemetry/tls-aws-lc"]
tls-ring = ["discus-telemetry/tls-ring"]
tls-openssl = ["discus-telemetry/tls-openssl"]
roots-system = ["discus-telemetry/roots-system"]
roots-webpki = ["discus-telemetry/roots-webpki"]

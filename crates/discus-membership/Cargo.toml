[package]
name = "discus-membership"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
discus-placement = { path = "../discus-placement" }
discus-wire = { path = "../discus-wire" }
fastrand = "2"
futures = "0.3"
parking_lot = "0.13"
thiserror = "2"
phi-accrual-failure-detector = "0.1"
tracing = "0.1"
tokio = { version = "1", features = ["time"], optional = true }
kube = { version = "5", default-features = false, features = ["client", "rustls-tls"], optional = true }
k8s-openapi = { version = "0.29", default-features = false, features = ["latest", "std"], optional = true }

# The simulator and the in-memory lease helpers for tests. Never enable `testing` in a release
# build. `k8s` adds the Kubernetes lease provider (spec section 6.2).
[features]
testing = []
k8s = ["dep:kube", "dep:k8s-openapi", "dep:tokio"]

[dev-dependencies]
discus-membership = { path = ".", features = ["testing"] }
proptest = "=1.12.0"
axum = "=0.8.9"
parking_lot = "=0.13.0"
rustls = { version = "=0.23.46", default-features = false, features = ["std", "aws-lc-rs"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["full"] }
kube = { version = "=5.0.0", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "=0.29.0", default-features = false, features = ["latest", "std"] }

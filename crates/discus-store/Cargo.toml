[package]
name = "discus-store"
version = "0.0.0"
edition.workspace = true

[lints]
workspace = true

[dependencies]
bytes = "1"
discus-placement = { path = "../discus-placement" }
fastrand = "2"
hashbrown = "0.17"
parking_lot = "0.13"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
tokio-util = "0.7"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
criterion = "=0.8.2"
discus-placement = { path = "../discus-placement", features = ["mock-clock"] }

[[bench]]
name = "store"
harness = false

{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "discus.fullname" . }}
  labels:
    {{- include "discus.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "discus.selectorLabels" . | nindent 6 }}
  # Egress stays open. The pods need DNS, the API server for the leases, the OTLP endpoint, and
  # the identity provider.
  policyTypes:
    - Ingress
  ingress:
    # Membership and node-to-node RPC: only the pods of this release.
    - from:
        - podSelector:
            matchLabels:
              {{- include "discus.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: UDP
          port: 7379
        - protocol: UDP
          port: 7380
    # A rule without "from" allows every source.
    - ports:
        - protocol: TCP
          port: 6379
        {{- if .Values.clusterClients.enabled }}
        - protocol: TCP
          port: {{ int .Values.clusterClients.port }}
        {{- end }}
      {{- with .Values.networkPolicy.clientFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - protocol: TCP
          port: 9100
      {{- with .Values.networkPolicy.adminFrom }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

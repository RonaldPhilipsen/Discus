{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "discus.fullname" . }}-lease
  labels:
    {{- include "discus.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "discus.fullname" . }}-lease
  labels:
    {{- include "discus.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "discus.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "discus.fullname" . }}-lease
{{- end }}

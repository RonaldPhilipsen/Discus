apiVersion: v1
kind: Service
metadata:
  name: {{ include "discus.fullname" . }}
  labels:
    {{- include "discus.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "discus.selectorLabels" . | nindent 4 }}
  ports:
    - name: resp
      port: {{ .Values.service.port }}
      targetPort: resp
    {{- if .Values.clusterClients.enabled }}
    - name: resp-cluster
      port: {{ int .Values.clusterClients.port }}
      targetPort: resp-cluster
    {{- end }}
---
# A joining node is not ready, and the other nodes must still find it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "discus.fullname" . }}-peers
  labels:
    {{- include "discus.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "discus.selectorLabels" . | nindent 4 }}
  ports:
    - name: cluster
      port: 7379
      protocol: UDP
    - name: rpc
      port: 7380
      protocol: UDP

replicaCount: 3

image:
  repository: ghcr.io/ronaldphilipsen/discus
  # The default is the appVersion of the chart.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # The default is the full name of the release.
  name: ""
  annotations: {}

# Creates the Role that lets the pods use the cluster lease.
rbac:
  create: true

service:
  type: ClusterIP
  port: 6379

# A second client listener. A cluster client reads the slot table from it and sends each command
# to the owner of the key. The nodes advertise their pod IPs, so only a client that can reach the
# pod network can use it. Other clients keep using the Service port above.
clusterClients:
  enabled: true
  port: 6380
  # The topology replies and -MOVED name each pod as
  # <pod IP with dashes>.<release>-peers.<namespace>.svc.<clusterDomain>, for example
  # 10-42-0-5.discus-peers.cache.svc.cluster.local. CoreDNS answers these names for the pods of the
  # headless peers Service. A certificate with one wildcard DNS SAN then serves every pod. Set this
  # to false to return pod IPs instead.
  hostnames: true
  clusterDomain: cluster.local
  # A host name template that replaces the default names. {ip} becomes the pod IP with dashes.
  hostname: ""

cluster:
  tls:
    # Required. A Secret with the keys ca.crt, tls.crt, and tls.key.
    secretName: ""
  san:
    # Requires a URI SAN on every peer certificate, for example a SPIFFE identity. While this is
    # false, every certificate from the CA is a member, so use a CA that serves only this release.
    enabled: false
    # The default is spiffe://cluster.local/ns/<namespace>/sa/<service account>.
    value: ""

# TLS on the client listener and the redirect listener. Every client uses TLS. Node-to-node
# traffic uses mTLS with cluster.tls.
clientTls:
  # A Secret with the keys tls.crt and tls.key. The default is cluster.tls.secretName.
  secretName: ""
  # Verifies client certificates against the key ca.crt of the Secret.
  verifyClients: false
  # A Secret with the key ca.crt that replaces the client CA, for example a private CA for client
  # certificates next to a public server certificate. The default is the Secret above.
  clientCaSecretName: ""
  # With verifyClients: optional or required.
  clientAuth: optional

# The flag --auth-policy, for example all:mtls or all:tls,oauth2. An empty value uses the node
# default none: every client uses TLS and needs no credentials.
authPolicy: ""
authConfig:
  # A Secret with the key auth.toml, for the flag --auth-config. The file lists the trusted
  # issuers and the client certificate rules. See docs/security.md.
  secretName: ""

# The number of databases that SELECT accepts. A higher value reaches the nodes through the
# settings file, so it needs no restart. A lower value applies nothing: see docs/cluster.md for the
# steps that lower the count and delete the data of the removed databases.
databases: 1

# The settings that a node reloads while it runs. The chart writes them to a ConfigMap, mounts it
# at /settings, and passes --config=/settings/discus.toml. A change reaches the pods after the
# kubelet syncs the ConfigMap and the node polls the file, so it needs no restart.
# A null value leaves a key out of the file, and the node then uses its built-in default. Do not set these settings in extraArgs: a
# flag overrides the file, and the node then ignores a reload of that setting.
settings:
  budget:
    # A forwarded read waits this long, then tries the next owner.
    forwardReadMs: 500
    # A forwarded write waits this long.
    forwardWriteMs: 2000
    # A write to a failed primary waits this long for a new primary.
    holdMs: 3000
    # A peer acknowledges a replication batch within this time.
    replicationMs: 1000
  reads:
    # Reads can go to a replica, not only to the primary.
    fromReplicas: true
  handoff:
    # The most bytes per second that one handoff scan sends.
    rateBytes: 33554432
  auth:
    maxFailuresPerConnection: 5
    maxFailuresPerSource: 20
    failureWindowSecs: 60
  tls:
    # Seconds between checks of the certificate files. 0 turns the checks off.
    reloadSecs: 10
  # A map of section name to a map of keys. The chart merges it into the file, for settings that a
  # newer Discus adds, for example:
  #   extra:
  #     budget:
  #       some-new-key: 5
  extra: {}

# The termination grace period of the pod is this value plus 15 seconds.
shutdownTimeoutSeconds: 30

# Tokio and the Rust standard library read the CPU limit from the cgroup. Without a CPU limit,
# the node starts one worker thread per host core. A fractional limit rounds down.
#
# The memory budget of the store is 75% of limits.memory. Without a memory limit, it is 1 GiB.
# To set the budget in bytes, add --max-memory to extraArgs.
resources:
  requests:
    cpu: "2"
    memory: 2Gi
  limits:
    cpu: "2"
    memory: 2Gi

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# OTLP/gRPC export of metrics and traces. Logs always go to stdout.
otel:
  enabled: false
  # An https:// endpoint turns on TLS.
  endpoint: http://otel-collector:4317
  # The fraction of new traces to keep, from 0 to 1.
  samplingRatio: 0.01
  exportIntervalSeconds: 10
  spanQueue: 2048
  tls:
    # A Secret with the key ca.crt. Without it, the node uses the trust roots of the build.
    # Needs an https:// endpoint.
    secretName: ""
    # Also presents the client certificate from the keys tls.crt and tls.key of the Secret.
    mutual: false

# CPU profiles pushed to a Pyroscope server, for example http://pyroscope.observability:4040.
# The image must be built with the pyroscope feature. The profiler needs a writable /tmp, so the
# pod gets an emptyDir there.
pyroscope:
  url: ""
  tmpSizeLimit: 64Mi

# A GrafanaDashboard resource for the Grafana Operator. It needs otel.enabled and a metrics store
# that keeps the OTLP metric names, for example VictoriaMetrics.
grafanaDashboard:
  enabled: false
  # Required when enabled. Selects the Grafana instance, for example:
  #   matchLabels:
  #     dashboards: grafana
  instanceSelector: {}

extraArgs: []
extraEnv: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.lints.clippy]
unwrap_used = "deny"

# A panic in a background task (membership, replication, counters, a reload watcher) would leave
# a node that passes liveness but half runs. Abort stops the process, and the pod restarts empty.
[profile.release]
panic = "abort"

name: Release

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

env:
  IMAGE: ghcr.io/ronaldphilipsen/discus

jobs:
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.semversie.outputs.release }}
      tag: ${{ steps.semversie.outputs.tag }}
      version: ${{ steps.semversie.outputs.version }}
      release-notes: ${{ steps.semversie.outputs.release-notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Calculate version
        id: semversie
        uses: RonaldPhilipsen/semVersie@v2.3.5

  build:
    name: Build image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha

  image:
    name: Build and push image
    needs: version
    if: github.event_name == 'push' && needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: Package and push Helm chart
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
      # The versions in Chart.yaml are placeholders. The released image tag is the source of truth.
      - name: Package chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm package charts/discus --version "$VERSION" --app-version "$VERSION"
      - name: Push chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm push "discus-$VERSION.tgz" oci://ghcr.io/ronaldphilipsen/charts

  release:
    name: Create GitHub release
    needs: [version, image, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NOTES: ${{ needs.version.outputs.release-notes }}
        run: gh release create "$TAG" --title "$TAG" --notes "$NOTES"

name: Release

on:
  push:
    branches:
      - main
  # A pull request with the label `release-candidate` publishes a release candidate.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Opening a pull request with a label starts two runs. Only the last one publishes.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  IMAGE: ghcr.io/ronaldphilipsen/discus

jobs:
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.semversie.outputs.release }}
      prerelease: ${{ steps.semversie.outputs.prerelease }}
      tag: ${{ steps.semversie.outputs.tag }}
      version: ${{ steps.semversie.outputs.version }}
      release-notes: ${{ steps.semversie.outputs.release-notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Calculate version
        id: semversie
        uses: RonaldPhilipsen/semVersie@d9fb879058f41166c1b18f7974eaed5620dd596b # v2.3.6

  build:
    name: Build image (${{ matrix.variant.name }})
    needs: version
    # A release candidate builds the same images in the job `image`.
    if: github.event_name == 'pull_request' && needs.version.outputs.release != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        variant: &variants
          - name: release
            features: ""
            suffix: ""
          # The same build with the Pyroscope profiler, for benchmarks.
          - name: pyroscope
            features: pyroscope
            suffix: -pyroscope
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: false
          build-args: |
            FEATURES=${{ matrix.variant.features }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}

  image:
    name: Build and push image (${{ matrix.variant.name }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: *variants
    steps:
      # A release candidate is the head of the pull request, not the merge commit of GitHub.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # The commit time, so a rebuild of the same commit gets the same label.
      - name: Read the commit time
        id: created
        run: echo "created=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.version.outputs.version }}${{ matrix.variant.suffix }}
          build-args: |
            FEATURES=${{ matrix.variant.features }}
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.event.pull_request.head.sha || github.sha }}
            CREATED=${{ steps.created.outputs.created }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}

  chart:
    name: Package and push Helm chart
    needs: [version, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Log in to the registry
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
      # The versions in Chart.yaml are placeholders. The released image tag is the source of truth.
      - name: Package chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm package charts/discus --version "$VERSION" --app-version "$VERSION"
      - name: Push chart
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: helm push "discus-$VERSION.tgz" oci://ghcr.io/ronaldphilipsen/charts

  release:
    name: Create GitHub release
    needs: [version, image, chart]
    # A release candidate gets no Git tag. semVersie reads the newest tag as the last release, so
    # after a tag v0.5.0-rc0 it would compute 0.6.0 for the release of the same pull request.
    if: needs.version.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NOTES: ${{ needs.version.outputs.release-notes }}
        run: gh release create "$TAG" --title "$TAG" --notes "$NOTES"
